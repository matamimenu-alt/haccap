openapi: 3.1.0
info:
  title: RCOS API
  version: 0.1.0
  description: |
    Restaurant Compliance OS — REST API.

    All responses use the envelope `{ success, data, meta? }` on success or
    `{ success: false, error: { code, message: { ar, en }, details? } }` on failure.

    All endpoints under `/companies`, `/brands`, `/branches`, `/users`,
    `/departments`, `/org-levels` require a Bearer access token; tenant is
    derived from the JWT and enforced server-side.
servers:
  - url: http://localhost:3001/api/v1
    description: Local dev
  - url: /api/v1
    description: Same-origin

tags:
  - name: Auth
  - name: Companies
  - name: Brands
  - name: Branches
  - name: Users
  - name: Roles
  - name: Departments
  - name: Org Levels
  - name: Health
  # Phase 2 — Operations Core
  - name: Areas
  - name: Asset Categories
  - name: Suppliers
  - name: Assets
  - name: Asset Tags
  - name: Attachments
  - name: Maintenance Schedules
  - name: QR

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      security: []
      summary: Liveness check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      status: { type: string, example: ok }
                      ts:    { type: string, format: date-time }

  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Log in with email + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:    { type: string, format: email }
                password: { type: string, minLength: 1 }
      responses:
        '200':
          description: Tokens + user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Rotate refresh token → new access + refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { $ref: '#/components/schemas/TokenBundle' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke refresh token (or all sessions for the current user)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkEnvelope' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user profile + roles
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { $ref: '#/components/schemas/CurrentUser' }

  /companies/me:
    get:
      tags: [Companies]
      summary: Get the current company
      responses:
        '200':
          description: Company
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { $ref: '#/components/schemas/Company' }
    patch:
      tags: [Companies]
      summary: Update the current company
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyPatch' }
      responses:
        '200':
          description: Updated company
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { $ref: '#/components/schemas/Company' }

  /brands:
    get:
      tags: [Brands]
      summary: List brands
      responses:
        '200':
          description: Brands
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Brand' }
    post:
      tags: [Brands]
      summary: Create a brand
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrandInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { $ref: '#/components/schemas/Brand' }

  /brands/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    patch:
      tags: [Brands]
      summary: Update a brand
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrandInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { $ref: '#/components/schemas/Brand' }
    delete:
      tags: [Brands]
      summary: Soft-delete a brand
      responses:
        '204': { description: Deleted }

  /branches:
    get:
      tags: [Branches]
      summary: List branches
      responses:
        '200':
          description: Branches
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Branch' }
    post:
      tags: [Branches]
      summary: Create a branch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { $ref: '#/components/schemas/Branch' }

  /branches/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Branches]
      summary: Get a branch
      responses:
        '200':
          description: Branch
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { $ref: '#/components/schemas/Branch' }
    patch:
      tags: [Branches]
      summary: Update a branch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { $ref: '#/components/schemas/Branch' }
    delete:
      tags: [Branches]
      summary: Soft-delete a branch
      responses:
        '204': { description: Deleted }

  /users:
    get:
      tags: [Users]
      summary: List users
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/UserSummary' }
    post:
      tags: [Users]
      summary: Invite / create a user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { $ref: '#/components/schemas/UserSummary' }

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    patch:
      tags: [Users]
      summary: Update a user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserPatch' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { $ref: '#/components/schemas/UserSummary' }
    delete:
      tags: [Users]
      summary: Soft-delete a user
      responses:
        '204': { description: Deleted }

  /roles:
    get:
      tags: [Roles]
      summary: List roles (system + company-defined)
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Role' }

  /roles/permissions:
    get:
      tags: [Roles]
      summary: List every permission in the catalog
      responses:
        '200':
          description: Permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Permission' }

  /roles/{id}/permissions:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Roles]
      summary: Permissions granted to a role
      responses:
        '200':
          description: Permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Permission' }

  /departments:
    get:
      tags: [Departments]
      responses:
        '200':
          description: Departments
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Department' }
    post:
      tags: [Departments]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartmentInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { $ref: '#/components/schemas/Department' }

  /departments/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    patch:
      tags: [Departments]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartmentInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { $ref: '#/components/schemas/Department' }
    delete:
      tags: [Departments]
      responses:
        '204': { description: Deleted }

  /org-levels:
    get:
      tags: [Org Levels]
      responses:
        '200':
          description: Org levels
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/OrgLevel' }
    post:
      tags: [Org Levels]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrgLevelInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { $ref: '#/components/schemas/OrgLevel' }

  /org-levels/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    patch:
      tags: [Org Levels]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrgLevelInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { $ref: '#/components/schemas/OrgLevel' }
    delete:
      tags: [Org Levels]
      responses:
        '204': { description: Deleted }

  # ============================================================
  # Phase 2 — Operations Core
  # ============================================================

  /areas:
    get:
      tags: [Areas]
      summary: List areas (optionally scoped to a branch)
      parameters:
        - in: query
          name: branchId
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Areas
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/Area' } }
    post:
      tags: [Areas]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AreaInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Area' }
  /areas/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    patch:
      tags: [Areas]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AreaInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Area' }
    delete:
      tags: [Areas]
      responses:
        '204': { description: Deleted }

  /asset-categories:
    get:
      tags: [Asset Categories]
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/AssetCategory' } }
    post:
      tags: [Asset Categories]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetCategoryInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/AssetCategory' }
  /asset-categories/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    patch:
      tags: [Asset Categories]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetCategoryInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/AssetCategory' }
    delete:
      tags: [Asset Categories]
      responses:
        '204': { description: Deleted }

  /suppliers:
    get:
      tags: [Suppliers]
      responses:
        '200':
          description: Suppliers
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/Supplier' } }
    post:
      tags: [Suppliers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Supplier' }
  /suppliers/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Suppliers]
      responses:
        '200':
          description: Supplier + contacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/SupplierWithContacts' }
    patch:
      tags: [Suppliers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Supplier' }
    delete:
      tags: [Suppliers]
      responses:
        '204': { description: Deleted }
  /suppliers/{id}/contacts:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Suppliers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierContactInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/SupplierContact' }

  /assets:
    get:
      tags: [Assets]
      summary: List assets with filters + pagination
      parameters:
        - { in: query, name: branchId,    schema: { type: string, format: uuid } }
        - { in: query, name: areaId,      schema: { type: string, format: uuid } }
        - { in: query, name: categoryId,  schema: { type: string, format: uuid } }
        - { in: query, name: status,      schema: { type: string, enum: [operational, needs_repair, under_maintenance, out_of_service, in_storage, decommissioned] } }
        - { in: query, name: criticality, schema: { type: string, enum: [low, medium, high, critical] } }
        - { in: query, name: kind,        schema: { type: string, enum: [equipment, fixture, furniture, vehicle, signage, tool, sensor, container, facility, other] } }
        - { in: query, name: supplierId,  schema: { type: string, format: uuid } }
        - { in: query, name: q,           schema: { type: string } }
        - { in: query, name: page,        schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: pageSize,    schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Assets
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/Asset' } }
                  meta:
                    type: object
                    properties:
                      page: { type: integer }
                      pageSize: { type: integer }
                      total: { type: integer }
                      totalPages: { type: integer }
    post:
      tags: [Assets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetInput' }
      responses:
        '201':
          description: Created (with fresh QR)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/AssetWithQr' }

  /assets/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Assets]
      responses:
        '200':
          description: Asset detail (hydrated)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/AssetHydrated' }
    patch:
      tags: [Assets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Asset' }

  /assets/{id}/decommission:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Assets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Decommissioned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Asset' }

  /assets/{id}/events:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Assets]
      summary: Immutable event log for the asset (append-only)
      responses:
        '200':
          description: Events (most recent first, capped at 500)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/AssetEvent' } }

  /assets/{id}/tags:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Assets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tagIds]
              properties:
                tagIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '204': { description: Attached }

  /assets/{id}/tags/{tagId}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
      - name: tagId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Assets]
      responses:
        '204': { description: Detached }

  /assets/{id}/warranties:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Assets]
      responses:
        '200':
          description: Warranties
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/Warranty' } }
    post:
      tags: [Assets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarrantyInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Warranty' }

  /assets/{id}/maintenance-schedules:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Assets]
      responses:
        '200':
          description: Maintenance schedules
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/MaintenanceSchedule' } }
    post:
      tags: [Assets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceScheduleInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/MaintenanceSchedule' }

  /assets/{id}/qr/reprint:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Assets]
      summary: Revoke the active QR and mint a new one
      responses:
        '201':
          description: New QR
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/AssetQr' }

  /asset-tags:
    get:
      tags: [Asset Tags]
      responses:
        '200':
          description: Tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/AssetTag' } }
    post:
      tags: [Asset Tags]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetTagInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/AssetTag' }

  /attachments:
    get:
      tags: [Attachments]
      parameters:
        - { in: query, name: targetType, required: true, schema: { type: string } }
        - { in: query, name: targetId,   required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Attachments (each item includes a short-lived signed URL)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/AttachmentWithUrl' } }
    post:
      tags: [Attachments]
      summary: Upload a file (multipart/form-data)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, targetType, targetId]
              properties:
                file: { type: string, format: binary }
                targetType: { type: string }
                targetId:   { type: string, format: uuid }
                kind:       { type: string, enum: [document, photo, video, audio, other] }
                caption:    { type: string }
                capturedAt: { type: string, format: date-time }
                latitude:   { type: string }
                longitude:  { type: string }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/AttachmentWithUrl' }
  /attachments/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    delete:
      tags: [Attachments]
      responses:
        '204': { description: Deleted }

  /maintenance-schedules:
    get:
      tags: [Maintenance Schedules]
      parameters:
        - { in: query, name: assetId,    schema: { type: string, format: uuid } }
        - { in: query, name: categoryId, schema: { type: string, format: uuid } }
        - { in: query, name: dueInDays,  schema: { type: integer, minimum: 0, maximum: 365 } }
      responses:
        '200':
          description: Schedules
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/MaintenanceSchedule' } }

  /qr/scan/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string, minLength: 8, maxLength: 64 }
    get:
      tags: [QR]
      summary: Resolve a scanned QR token to an asset
      responses:
        '200':
          description: Resolved asset summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/QrResolveResult' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    OkEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:    { type: object }

    ErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code:    { type: string }
            message:
              type: object
              properties:
                ar: { type: string }
                en: { type: string }
            details: {}

    BilingualString:
      type: object
      properties:
        ar: { type: string }
        en: { type: string }

    TokenBundle:
      type: object
      properties:
        accessToken:            { type: string }
        accessTokenExpiresIn:   { type: integer }
        refreshToken:           { type: string }
        refreshTokenExpiresAt:  { type: string, format: date-time }
        roles:
          type: array
          items: { type: string }

    LoginResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          allOf:
            - $ref: '#/components/schemas/TokenBundle'
            - type: object
              properties:
                user: { $ref: '#/components/schemas/CurrentUser' }

    CurrentUser:
      type: object
      properties:
        id:              { type: string, format: uuid }
        email:           { type: string, format: email }
        fullNameAr:      { type: string }
        fullNameEn:      { type: string }
        preferredLocale: { type: string, enum: [ar, en] }
        avatarUrl:       { type: [string, 'null'] }
        companyId:       { type: string, format: uuid }
        branchIds:
          type: array
          items: { type: string, format: uuid }
        roles:
          type: array
          items: { type: string }

    Company:
      type: object
      properties:
        id:                     { type: string, format: uuid }
        slug:                   { type: string }
        nameAr:                 { type: string }
        nameEn:                 { type: string }
        commercialRegistration: { type: [string, 'null'] }
        vatNumber:              { type: [string, 'null'] }
        country:                { type: string }
        defaultLocale:          { type: string, enum: [ar, en] }
        timezone:               { type: string }
        status:                 { type: string, enum: [trial, active, suspended, archived] }
        logoUrl:                { type: [string, 'null'] }
        enabledModules:
          type: array
          items: { type: string }
        settings:               { type: object, additionalProperties: true }
        createdAt:              { type: string, format: date-time }
        updatedAt:              { type: string, format: date-time }

    CompanyPatch:
      type: object
      properties:
        nameAr:                 { type: string }
        nameEn:                 { type: string }
        commercialRegistration: { type: [string, 'null'] }
        vatNumber:              { type: [string, 'null'] }
        defaultLocale:          { type: string, enum: [ar, en] }
        timezone:               { type: string }
        logoUrl:                { type: [string, 'null'] }
        settings:               { type: object, additionalProperties: true }

    Brand:
      type: object
      properties:
        id:          { type: string, format: uuid }
        companyId:   { type: string, format: uuid }
        nameAr:      { type: string }
        nameEn:      { type: string }
        slug:        { type: string }
        logoUrl:     { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        createdAt:   { type: string, format: date-time }
        updatedAt:   { type: string, format: date-time }

    BrandInput:
      type: object
      properties:
        nameAr:      { type: string }
        nameEn:      { type: string }
        slug:        { type: string }
        logoUrl:     { type: [string, 'null'] }
        description: { type: [string, 'null'] }

    Branch:
      type: object
      properties:
        id:                            { type: string, format: uuid }
        companyId:                     { type: string, format: uuid }
        brandId:                       { type: [string, 'null'], format: uuid }
        code:                          { type: string }
        nameAr:                        { type: string }
        nameEn:                        { type: string }
        restaurantType:
          type: string
          enum: [fast_food, casual_dining, fine_dining, shawarma, bakery, coffee_shop, buffet, cloud_kitchen, catering, other]
        status:
          type: string
          enum: [active, inactive, closed_for_renovation, permanently_closed]
        city:                          { type: string }
        region:                        { type: [string, 'null'] }
        addressLine:                   { type: [string, 'null'] }
        latitude:                      { type: [string, 'null'] }
        longitude:                     { type: [string, 'null'] }
        municipalityLicenseNumber:     { type: [string, 'null'] }
        municipalityLicenseExpiryDate: { type: [string, 'null'] }
        seatingCapacity:               { type: [integer, 'null'] }
        staffHeadcount:                { type: [integer, 'null'] }
        createdAt:                     { type: string, format: date-time }
        updatedAt:                     { type: string, format: date-time }

    BranchInput:
      type: object
      properties:
        brandId:                       { type: [string, 'null'], format: uuid }
        code:                          { type: string }
        nameAr:                        { type: string }
        nameEn:                        { type: string }
        restaurantType:
          type: string
          enum: [fast_food, casual_dining, fine_dining, shawarma, bakery, coffee_shop, buffet, cloud_kitchen, catering, other]
        status:
          type: string
          enum: [active, inactive, closed_for_renovation, permanently_closed]
        city:                          { type: string }
        region:                        { type: [string, 'null'] }
        addressLine:                   { type: [string, 'null'] }
        latitude:                      { type: [number, 'null'] }
        longitude:                     { type: [number, 'null'] }
        municipalityLicenseNumber:     { type: [string, 'null'] }
        municipalityLicenseExpiryDate: { type: [string, 'null'] }
        seatingCapacity:               { type: [integer, 'null'] }
        staffHeadcount:                { type: [integer, 'null'] }

    UserSummary:
      type: object
      properties:
        id:              { type: string, format: uuid }
        email:           { type: string, format: email }
        phone:           { type: [string, 'null'] }
        fullNameAr:      { type: string }
        fullNameEn:      { type: string }
        preferredLocale: { type: string, enum: [ar, en] }
        status:          { type: string, enum: [active, invited, suspended, deactivated] }
        branchIds:
          type: array
          items: { type: string, format: uuid }
        departmentId:    { type: [string, 'null'], format: uuid }
        avatarUrl:       { type: [string, 'null'] }
        lastLoginAt:     { type: [string, 'null'], format: date-time }
        createdAt:       { type: string, format: date-time }

    UserInput:
      type: object
      required: [email, password, fullNameAr, fullNameEn, roleKeys]
      properties:
        email:           { type: string, format: email }
        password:        { type: string, minLength: 8 }
        fullNameAr:      { type: string }
        fullNameEn:      { type: string }
        phone:           { type: [string, 'null'] }
        preferredLocale: { type: string, enum: [ar, en] }
        branchIds:
          type: array
          items: { type: string, format: uuid }
        departmentId:    { type: [string, 'null'], format: uuid }
        roleKeys:
          type: array
          items: { type: string }

    UserPatch:
      type: object
      properties:
        fullNameAr:      { type: string }
        fullNameEn:      { type: string }
        phone:           { type: [string, 'null'] }
        preferredLocale: { type: string, enum: [ar, en] }
        branchIds:
          type: array
          items: { type: string, format: uuid }
        departmentId:    { type: [string, 'null'], format: uuid }
        status:          { type: string, enum: [active, invited, suspended, deactivated] }
        avatarUrl:       { type: [string, 'null'] }

    Role:
      type: object
      properties:
        id:          { type: string, format: uuid }
        companyId:   { type: [string, 'null'], format: uuid }
        key:         { type: string }
        nameAr:      { type: string }
        nameEn:      { type: string }
        description: { type: [string, 'null'] }
        isSystem:    { type: boolean }
        priority:    { type: string }
        createdAt:   { type: string, format: date-time }

    Permission:
      type: object
      properties:
        id:     { type: string, format: uuid }
        key:    { type: string, description: "module:action" }
        module: { type: string }
        action: { type: string }

    Department:
      type: object
      properties:
        id:        { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        nameAr:    { type: string }
        nameEn:    { type: string }
        code:      { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    DepartmentInput:
      type: object
      required: [nameAr, nameEn]
      properties:
        nameAr: { type: string }
        nameEn: { type: string }
        code:   { type: [string, 'null'] }

    OrgLevel:
      type: object
      properties:
        id:            { type: string, format: uuid }
        companyId:     { type: string, format: uuid }
        depth:         { type: integer }
        nameAr:        { type: string }
        nameEn:        { type: string }
        parentLevelId: { type: [string, 'null'], format: uuid }
        createdAt:     { type: string, format: date-time }

    OrgLevelInput:
      type: object
      required: [depth, nameAr, nameEn]
      properties:
        depth:         { type: integer, minimum: 0, maximum: 10 }
        nameAr:        { type: string }
        nameEn:        { type: string }
        parentLevelId: { type: [string, 'null'], format: uuid }

    # ==========================================================
    # Phase 2 — Operations Core
    # ==========================================================

    Area:
      type: object
      properties:
        id:            { type: string, format: uuid }
        companyId:     { type: string, format: uuid }
        branchId:      { type: string, format: uuid }
        parentAreaId:  { type: [string, 'null'], format: uuid }
        code:          { type: string }
        nameAr:        { type: string }
        nameEn:        { type: string }
        kind:
          type: string
          enum: [kitchen, cook_line, prep, dishwash, cold_storage, freezer, dry_storage, receiving, waste, mechanical, dining, restroom, office, front_of_house, outdoor, other]
        description:       { type: [string, 'null'] }
        riskLevel:
          type: string
          enum: [none, low, medium, high, critical]
        complianceScope:   { type: array, items: { type: string } }
        targetTempMinC:    { type: [string, 'null'] }
        targetTempMaxC:    { type: [string, 'null'] }
        targetHumidityPct: { type: [string, 'null'] }
        aiSummary:         { type: [string, 'null'] }
        aiMetadata:        { type: object, additionalProperties: true }
        isActive:          { type: boolean }
        metadata:          { type: object, additionalProperties: true }
        createdAt:         { type: string, format: date-time }
        updatedAt:         { type: string, format: date-time }

    AreaInput:
      type: object
      required: [branchId, code, nameAr, nameEn]
      properties:
        branchId:       { type: string, format: uuid }
        parentAreaId:   { type: [string, 'null'], format: uuid }
        code:           { type: string }
        nameAr:         { type: string }
        nameEn:         { type: string }
        kind:
          type: string
          enum: [kitchen, cook_line, prep, dishwash, cold_storage, freezer, dry_storage, receiving, waste, mechanical, dining, restroom, office, front_of_house, outdoor, other]
        description:       { type: [string, 'null'] }
        riskLevel:
          type: string
          enum: [none, low, medium, high, critical]
        complianceScope:   { type: array, items: { type: string } }
        targetTempMinC:    { type: [string, 'null'] }
        targetTempMaxC:    { type: [string, 'null'] }
        targetHumidityPct: { type: [string, 'null'] }
        metadata:          { type: object, additionalProperties: true }
        isActive:          { type: boolean }

    AssetCategory:
      type: object
      properties:
        id:               { type: string, format: uuid }
        companyId:        { type: [string, 'null'], format: uuid, description: "null = system category" }
        parentId:         { type: [string, 'null'], format: uuid }
        key:              { type: string }
        nameAr:           { type: string }
        nameEn:           { type: string }
        description:      { type: [string, 'null'] }
        path:             { type: string }
        depth:            { type: integer }
        defaultAssetKind: { type: string, enum: [equipment, fixture, furniture, vehicle, signage, tool, sensor, container, facility, other] }
        riskLevel:        { type: string, enum: [none, low, medium, high, critical] }
        suggestedSpecs:
          type: array
          items:
            type: object
            properties:
              key:   { type: string }
              label: { type: object, properties: { ar: { type: string }, en: { type: string } } }
              type:  { type: string }
              unit:  { type: string }
        aiHints:  { type: object, additionalProperties: true }
        isSystem: { type: boolean }
        isActive: { type: boolean }
        iconKey:  { type: [string, 'null'] }
        colorHex: { type: [string, 'null'] }

    AssetCategoryInput:
      type: object
      required: [key, nameAr, nameEn]
      properties:
        parentId:         { type: [string, 'null'], format: uuid }
        key:              { type: string }
        nameAr:           { type: string }
        nameEn:           { type: string }
        description:      { type: [string, 'null'] }
        defaultAssetKind: { type: string }
        riskLevel:        { type: string }
        suggestedSpecs:   { type: array, items: { type: object } }
        aiHints:          { type: object, additionalProperties: true }
        iconKey:          { type: [string, 'null'] }
        colorHex:         { type: [string, 'null'] }

    Supplier:
      type: object
      properties:
        id:                     { type: string, format: uuid }
        companyId:              { type: string, format: uuid }
        code:                   { type: [string, 'null'] }
        nameAr:                 { type: string }
        nameEn:                 { type: string }
        legalName:              { type: [string, 'null'] }
        commercialRegistration: { type: [string, 'null'] }
        vatNumber:              { type: [string, 'null'] }
        email:                  { type: [string, 'null'], format: email }
        phone:                  { type: [string, 'null'] }
        website:                { type: [string, 'null'] }
        country:                { type: string }
        city:                   { type: [string, 'null'] }
        addressLine:            { type: [string, 'null'] }
        categories:             { type: array, items: { type: string } }
        ratingAvg:              { type: [string, 'null'] }
        ratingCount:            { type: string }
        approvals:              { type: object, additionalProperties: true }
        aiSummary:              { type: [string, 'null'] }
        aiMetadata:             { type: object, additionalProperties: true }
        isActive:               { type: boolean }
        isPreferred:            { type: boolean }
        notes:                  { type: [string, 'null'] }

    SupplierInput:
      type: object
      required: [nameAr, nameEn]
      properties:
        code:                   { type: [string, 'null'] }
        nameAr:                 { type: string }
        nameEn:                 { type: string }
        legalName:              { type: [string, 'null'] }
        commercialRegistration: { type: [string, 'null'] }
        vatNumber:              { type: [string, 'null'] }
        email:                  { type: [string, 'null'], format: email }
        phone:                  { type: [string, 'null'] }
        website:                { type: [string, 'null'] }
        country:                { type: string }
        city:                   { type: [string, 'null'] }
        addressLine:            { type: [string, 'null'] }
        categories:             { type: array, items: { type: string } }
        approvals:              { type: object, additionalProperties: true }
        isPreferred:            { type: boolean }
        notes:                  { type: [string, 'null'] }

    SupplierContact:
      type: object
      properties:
        id:         { type: string, format: uuid }
        supplierId: { type: string, format: uuid }
        fullName:   { type: string }
        title:      { type: [string, 'null'] }
        email:      { type: [string, 'null'], format: email }
        phone:      { type: [string, 'null'] }
        isPrimary:  { type: boolean }

    SupplierContactInput:
      type: object
      required: [fullName]
      properties:
        fullName:  { type: string }
        title:     { type: [string, 'null'] }
        email:     { type: [string, 'null'], format: email }
        phone:     { type: [string, 'null'] }
        isPrimary: { type: boolean }
        notes:     { type: [string, 'null'] }

    SupplierWithContacts:
      allOf:
        - $ref: '#/components/schemas/Supplier'
        - type: object
          properties:
            contacts:
              type: array
              items: { $ref: '#/components/schemas/SupplierContact' }

    Asset:
      type: object
      properties:
        id:               { type: string, format: uuid }
        companyId:        { type: string, format: uuid }
        branchId:         { type: string, format: uuid }
        areaId:           { type: [string, 'null'], format: uuid }
        categoryId:       { type: [string, 'null'], format: uuid }
        kind:             { type: string, enum: [equipment, fixture, furniture, vehicle, signage, tool, sensor, container, facility, other] }
        code:             { type: string }
        nameAr:           { type: string }
        nameEn:           { type: string }
        description:      { type: [string, 'null'] }
        manufacturer:     { type: [string, 'null'] }
        model:            { type: [string, 'null'] }
        serialNumber:     { type: [string, 'null'] }
        barcode:          { type: [string, 'null'] }
        spec:             { type: object, additionalProperties: true }
        status:           { type: string, enum: [operational, needs_repair, under_maintenance, out_of_service, in_storage, decommissioned] }
        criticality:      { type: string, enum: [low, medium, high, critical] }
        riskLevel:        { type: string, enum: [none, low, medium, high, critical] }
        supplierId:       { type: [string, 'null'], format: uuid }
        purchaseDate:     { type: [string, 'null'], format: date }
        purchaseCost:     { type: [string, 'null'] }
        currency:         { type: string }
        installedDate:    { type: [string, 'null'], format: date }
        expectedLifespanMonths: { type: [integer, 'null'] }
        decommissionedAt: { type: [string, 'null'], format: date-time }
        decommissionReason: { type: [string, 'null'] }
        lastServicedAt:   { type: [string, 'null'], format: date-time }
        nextServiceDueAt: { type: [string, 'null'], format: date-time }
        aiSummary:        { type: [string, 'null'] }
        aiMetadata:       { type: object, additionalProperties: true }
        metadata:         { type: object, additionalProperties: true }
        createdAt:        { type: string, format: date-time }
        updatedAt:        { type: string, format: date-time }

    AssetInput:
      type: object
      required: [branchId, code, nameAr, nameEn]
      properties:
        branchId:      { type: string, format: uuid }
        areaId:        { type: [string, 'null'], format: uuid }
        categoryId:    { type: [string, 'null'], format: uuid }
        kind:          { type: string }
        code:          { type: string }
        nameAr:        { type: string }
        nameEn:        { type: string }
        description:   { type: [string, 'null'] }
        manufacturer:  { type: [string, 'null'] }
        model:         { type: [string, 'null'] }
        serialNumber:  { type: [string, 'null'] }
        barcode:       { type: [string, 'null'] }
        spec:          { type: object, additionalProperties: true }
        status:        { type: string }
        criticality:   { type: string }
        riskLevel:     { type: string }
        supplierId:    { type: [string, 'null'], format: uuid }
        purchaseDate:  { type: [string, 'null'], format: date }
        purchaseCost:  { type: [number, 'null'] }
        currency:      { type: string }
        installedDate: { type: [string, 'null'], format: date }
        expectedLifespanMonths: { type: [integer, 'null'] }
        metadata:      { type: object, additionalProperties: true }

    AssetQr:
      type: object
      properties:
        id:        { type: string, format: uuid }
        token:     { type: string }
        scanUrl:   { type: string }
        isActive:  { type: boolean }
        printedAt: { type: [string, 'null'], format: date-time }

    AssetWithQr:
      allOf:
        - $ref: '#/components/schemas/Asset'
        - type: object
          properties:
            activeQr: { $ref: '#/components/schemas/AssetQr' }

    AssetHydrated:
      allOf:
        - $ref: '#/components/schemas/Asset'
        - type: object
          properties:
            branch:  { type: object, properties: { id: { type: string, format: uuid }, nameEn: { type: string }, nameAr: { type: string } } }
            area:    { type: [object, 'null'] }
            category: { type: [object, 'null'] }
            supplier: { type: [object, 'null'] }
            activeQr: { type: [object, 'null'] }
            tags:
              type: array
              items:
                type: object
                properties:
                  id:       { type: string, format: uuid }
                  key:      { type: string }
                  labelEn:  { type: string }
                  labelAr:  { type: string }
                  colorHex: { type: [string, 'null'] }

    AssetEvent:
      type: object
      properties:
        id:            { type: string, format: uuid }
        assetId:       { type: string, format: uuid }
        eventType:
          type: string
          enum: [created, updated, moved, status_changed, category_changed, kind_changed, tagged, untagged, warranty_added, warranty_updated, warranty_expired, maintenance_scheduled, maintenance_updated, maintenance_completed, service_performed, inspected, decommissioned, reinstated, document_added, document_removed, photo_added, photo_removed, qr_generated, qr_reprinted, spec_updated, supplier_assigned, note_added]
        actorUserId:   { type: [string, 'null'], format: uuid }
        source:        { type: string }
